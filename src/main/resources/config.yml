# Per-item timer: seconds a dropped item must lie on the ground, untouched,
# before it can be auto-looted. The timer only runs while the item's chunk is loaded,
# and restarts when someone (player, mob or hopper) picks part of the stack up.
loot-delay-seconds: 300

# Global loot timer: how often, in seconds, the plugin sweeps the worlds.
# Each sweep loots every item whose own timer reached loot-delay-seconds, all at once.
loot-interval-seconds: 60

# Items a player dropped, or lost on death, are reserved for that player for this many
# seconds after they are looted. Only they (and admins) can take them meanwhile. 0 = off.
owner-priority-seconds: 600

# The storage shows one entry per distinct item, 45 entries per page. Storage is unlimited by default.
# Maximum number of pages. 0 = unlimited. When the cap is hit, items that would need a new
# entry stay on the ground. More of an item already in storage always fits.
max-pages: 0

# Worlds where dropped items are never looted, for example a creative world.
excluded-worlds: []

# Item types that are never looted, such as junk. Use Bukkit material names, like DIRT
# or DIAMOND_SWORD. * matches anything, so *_SAPLING matches every sapling.
excluded-items: []

# Skip items that can never be picked up, such as shop plugin display items.
ignore-unpickupable-items: true

# Broadcast after a sweep that looted at least one item.
# {count} = total number of items, {stacks} = number of dropped stacks looted.
broadcast-message: "&e[Unlooted] &f{count} &eitem(s) were auto-looted. Type &f/unlooted &eto claim them."
